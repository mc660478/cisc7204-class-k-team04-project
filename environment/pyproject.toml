[project]
name = "code"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "bokeh>=3.4.3",
    "dash>=4.4.1",
    "empiricaldist>=0.10.0",
    "folium>=0.20.0",
    "h5py>=3.14.0",
    "ipykernel>=6.31.0",
    "jupyter>=1.1.1",
    "jupyter-bokeh>=4.1.0",
    "kaleido>=1.3.0",
    "matplotlib>=3.9.4",
    "notebook>=7.5.7",
    "numpy>=2.0.2",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "plotly>=7.1.0",
    "pywaffle>=1.2.0",
    "requests>=2.32.5",
    "scikit-learn>=1.6.1",
    "scipy>=1.13.1",
    "seaborn>=0.13.2",
    "tables>=3.9.2",
    "tqdm>=4.70.0",
    "wordcloud>=1.9.6",
]

[project.scripts]
code = "code:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
